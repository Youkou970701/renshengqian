<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920"><rect width="1080" height="1920" fill="#14362c"/><g font-family="PingFang SC, Heiti SC, sans-serif" fill="#edf5db"><path d="M55 170H1025M55 1750H1025" stroke="#bdd18d" stroke-width="2"/><text x="60" y="103" font-size="39" font-weight="700">投胎模拟器</text><text x="1020" y="103" text-anchor="end" font-size="25" fill="#b9cbad">C / 人生摇号机</text><text x="60" y="225" font-size="25" letter-spacing="5">本轮人生 · 已封存</text><text x="60" y="311" font-size="57" font-weight="700">周亦辰</text><text x="60" y="365" font-size="28" fill="#b9cbad">广东 · 饶平县 · 农村户口</text><circle cx="540" cy="752" r="299" fill="none" stroke="#49664b" stroke-width="1"/><circle cx="540" cy="752" r="271" fill="none" stroke="#49664b" stroke-dasharray="2 15" stroke-width="17"/><path d="M540 433L520 464H560Z" fill="#ff9252"/><rect x="196" y="593" width="688" height="292" fill="#0d241c" stroke="#b4ce89" stroke-width="3"/><rect x="218" y="615" width="310" height="247" fill="#223d2b"/><text x="373" y="826" text-anchor="middle" font-family="Menlo, monospace" font-size="218" font-weight="700" fill="#d8f19b">6</text><rect x="544" y="615" width="310" height="247" fill="#223d2b"/><text x="699" y="826" text-anchor="middle" font-family="Menlo, monospace" font-size="218" font-weight="700" fill="#d8f19b">7</text><text x="540" y="977" text-anchor="middle" font-size="40" fill="#d8f19b">年，是这次抽签的一生</text><rect x="60" y="1079" width="960" height="105" fill="#ff9252"/><text x="90" y="1148" font-size="47" font-weight="700" fill="#15362c">初中 / 工厂工人</text><text x="64" y="1260" font-size="64" fill="#edf5db">只读完初中，也走过一生</text><path d="M60 1465H1020" stroke="#67805a"/><text x="60" y="1523" font-size="29" fill="#b9cbad">同省同年出生的 100 个人中</text><text x="60" y="1628" font-size="84" font-weight="700" fill="#d8f19b">31 <tspan font-size="35">个人读了本科</tspan></text><text x="60" y="1700" font-size="27">粤-2026-694669　·　肺癌</text><text x="60" y="1812" font-size="27" fill="#b9cbad">再摇一次，拿到的未必是同一副牌。</text><text x="60" y="1861" font-size="19" fill="#b9cbad">基于公开统计的模拟，不代表任何个人命运。15岁以上。</text></g></svg>