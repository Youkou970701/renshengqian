<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920"><rect width="1080" height="1920" fill="#f7faf3"/><g font-family="PingFang SC, Heiti SC, sans-serif" fill="#173d36"><text x="66" y="100" font-size="38" font-weight="700">投胎模拟器</text><text x="1010" y="100" text-anchor="end" font-size="26">E / 人生长卷</text><path d="M65 140H1015" stroke="#173d36"/><text x="65" y="240" font-size="67" font-weight="700">刘欣怡的一生</text><text x="65" y="300" font-size="30">北京 · 怀柔区 · 城市户口</text><text x="65" y="495" font-size="178" font-weight="700">92<tspan font-size="45">岁</tspan></text><text x="65" y="560" font-size="29" fill="#587267">从出生地，走到这一站。</text><g transform="translate(620 427) scale(0.9)"><path d="M180 0C60 100 430 160 280 330S60 570 240 730S440 960 220 1140" stroke="#d39c5c" stroke-width="34" fill="none"/><g fill="#88b9a7"><path d="M0 65H110V245H0Z"/><path d="M145 0H250V245H145Z"/><path d="M285 88H365V245H285Z"/><path d="M30 456H330V625H30Z"/><path d="M0 456L180 370L360 456Z"/><path d="M0 890H360V1060H0Z"/><path d="M0 890L90 820V890L180 820V890L270 820V890Z"/><path d="M300 760H338V890H300Z"/></g><g fill="#f7faf3"><path d="M45 158H80V208H45Z M112 158H143V208H112Z M225 180H270V223H225Z"/><path d="M65 492H109V535H65Z M155 492H199V535H155Z M245 492H289V535H245Z M155 566H205V625H155Z"/><path d="M35 937H80V987H35Z M115 937H160V987H115Z M195 937H240V987H195Z M275 937H320V987H275Z"/></g><g fill="#215d4f"><path d="M355 195L390 115L425 195Z M350 225L390 145L430 225Z"/><path d="M-45 605L-10 525L25 605Z M-50 635L-10 555L30 635Z"/><circle cx="280" cy="330" r="12"/><circle cx="240" cy="730" r="12"/></g></g><path d="M80 690V1390" stroke="#d39c5c" stroke-width="5"/><g fill="#215d4f"><circle cx="80" cy="704" r="12"/><circle cx="80" cy="910" r="12"/><circle cx="80" cy="1116" r="12"/></g><text x="117" y="714" font-size="28" fill="#587267">出生</text><text x="116" y="770" font-size="30" fill="#173d36">2026 年 · 怀柔区</text><text x="117" y="922" font-size="28" fill="#587267">求学</text><text x="116" y="984" font-size="42" fill="#173d36">专科</text><text x="117" y="1128" font-size="28" fill="#587267">成年以后</text><text x="116" y="1191" font-size="40" fill="#173d36">工厂工人</text><path d="M65 1455H1015" stroke="#173d36"/><text x="65" y="1516" font-size="29" fill="#587267">同省同年出生的 100 人里</text><text x="65" y="1619" font-size="90" font-weight="700">59<tspan font-size="39"> 个人读了本科</tspan></text><text x="65" y="1710" font-size="64" fill="#173d36">没读本科，也走过一生</text><text x="65" y="1833" font-size="25">京-2026-066321 · 脑卒中</text><text x="65" y="1881" font-size="18" fill="#587267">基于公开统计的模拟，不代表任何个人命运。15岁以上。</text></g></svg>