<!doctype html><html lang="zh-CN"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>统计出处与说明 · 投胎模拟器</title>
<style>body{margin:0;background:#f7f9f3;color:#20382c;font:16px/1.85 'PingFang SC','Microsoft YaHei',sans-serif}main{max-width:760px;margin:auto;padding:32px 22px}h1{font-size:36px;line-height:1.2;border-top:6px solid;padding-top:24px}a{color:inherit}li{padding:12px 0;border-bottom:1px solid #bdcbbb}small{color:#536956}</style>
<main><a href="./">← 五个视觉方向</a><h1>数字从哪里来</h1><p id="note"></p><p>终局卡的「同省同年出生的100人」来自本地十万人模拟参考队列，是模拟人数换算，不是现实抽样调查。点阵中的强调色标记主人公。</p><ul id="sources"></ul><small>此处汇总两个展示人生实际引用的统计。具体年份和口径保留在每条出处内。</small></main>
<script type="module">import data from './data.json' with {type:'json'};document.querySelector('#note').textContent=data.rural.sourcesNote;const notes=[...new Set(Object.values(data).flatMap(d=>[d.mid.footnote,...d.mid.log.map(e=>e.footnote),...d.end.chapterLog.map(e=>e.footnote)]).filter(Boolean))];for(const note of notes){const li=document.createElement('li');li.textContent=note;document.querySelector('#sources').append(li);}</script></html>
